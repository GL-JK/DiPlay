name: Wuling standalone build

on:
  push:
    branches: ['clean-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Materialize runtime authentication assets from secrets
        env:
          MFI_IDENTITY_PK8_B64: ${{ secrets.MFI_IDENTITY_PK8_B64 }}
          MFI_CERT_P7B_B64: ${{ secrets.MFI_CERT_P7B_B64 }}
        run: |
          set -euo pipefail
          test -n "$MFI_IDENTITY_PK8_B64"
          test -n "$MFI_CERT_P7B_B64"
          dir="$RUNNER_TEMP/runtime-assets/offline-mfi"
          mkdir -p "$dir"
          printf '%s' "$MFI_IDENTITY_PK8_B64" | base64 -d > "$dir/identity.pk8"
          printf '%s' "$MFI_CERT_P7B_B64" | base64 -d > "$dir/certificate.p7b"
          test -s "$dir/identity.pk8" && test -s "$dir/certificate.p7b"
          echo "DIPLAY_AUTH_ASSETS_DIR=$RUNNER_TEMP/runtime-assets" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and standalone debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:assembleStandaloneDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuling-test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Wuling-clean
          path: |
            mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
